<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="512" height="512" fill="#0f172a"/>
  
  <!-- Outer frame -->
  <rect x="50" y="70" width="410" height="370" fill="none" stroke="url(#grad1)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner decorative frame -->
  <rect x="100" y="120" width="310" height="270" fill="none" stroke="#2d2a5f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Building -->
  <g stroke="url(#grad1)" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Building body -->
    <rect x="170" y="260" width="160" height="120"/>
    
    <!-- Roof -->
    <polygon points="250,260 170,200 330,200"/>
    
    <!-- Door -->
    <rect x="235" y="300" width="30" height="50"/>
    
    <!-- Window 1 -->
    <rect x="200" y="310" width="20" height="20"/>
    
    <!-- Window 2 -->
    <rect x="290" y="310" width="20" height="20"/>
  </g>
  
  <!-- Trending chart line with arrow -->
  <g stroke="url(#grad1)" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="60,330 160,240 260,130 380,40"/>
  </g>
  
  <!-- Arrow head -->
  <polygon points="380,40 420,15 390,85" fill="url(#grad1)"/>
</svg>