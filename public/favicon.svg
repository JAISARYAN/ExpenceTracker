<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#faviconGradient)" opacity="0.95"/>
  
  <!-- Wallet shape -->
  <rect x="20" y="35" width="60" height="40" rx="6" fill="white" opacity="0.9"/>
  
  <!-- Card in wallet -->
  <rect x="30" y="45" width="40" height="20" rx="3" fill="url(#cardGradient)" opacity="0.8"/>
  
  <!-- Coin shapes -->
  <circle cx="45" cy="55" r="5" fill="url(#coinGradient)"/>
  <circle cx="60" cy="55" r="5" fill="url(#coinGradient2)"/>
  
  <!-- Arrow up (trending) -->
  <path d="M50 28 L50 38 M45 33 L50 28 L55 33" stroke="white" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round" opacity="0.9"/>
  
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06B6D4"/>
      <stop offset="100%" stopColor="#0369A1"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06B6D4"/>
      <stop offset="100%" stopColor="#0369A1"/>
    </linearGradient>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10B981"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>
    <linearGradient id="coinGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#D97706"/>
    </linearGradient>
  </defs>
</svg>